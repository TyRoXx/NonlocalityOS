[package]
name = "import_dropbox_cli"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
astraea = { path ="../../astraea" }
sorted_tree = { path ="../../sorted_tree" }
dropbox_importer = { path ="../dropbox_importer" }
tokio = {version = "1", features = ["sync"]}
tracing = "0"
tracing-subscriber = "0"
dotenv = "0"
dropbox-sdk = {version = "0", features = ["async_routes", "default_async_client"]}
rusqlite = {version = "0", features = ["bundled"]}

[dev-dependencies]
test-log = {version = "0", features = ["trace", "log", "color"]}
pretty_assertions = "1"
